version: '3.8'
services:
  db:
    image: postgres:16.4-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432" 
    volumes:
      - pgdata:/var/lib/postgresql/data # Persist data

  # TODO: Configure backend service to make it run the NestJS application and respond to requests
  backend:
    build: .
    container_name: nestjs_backend
    ports:
      - "9000:9000"
    env_file:
      - .env
    depends_on:
      - db
    # Explicitly define the command to ensure tsconfig-paths is used
    # If the package.json start script is updated, this may not be strictly necessary,
    # but it guarantees the correct command is run.
    command: node -r tsconfig-paths/register dist/main

volumes:
  pgdata: